# Dev server with live reload:  docker compose up --build   →  http://localhost:5173
services:
  web:
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    volumes:
      # source is bind-mounted, so edits on the host hot-reload in the container
      - ./:/app
      # keep the container's own node_modules (Linux binaries) instead of the host's
      - node_modules:/app/node_modules
    environment:
      # set to "1" if file changes are not picked up (e.g. some Windows / network file systems)
      VITE_POLLING: ${VITE_POLLING:-0}
    init: true
    restart: unless-stopped

volumes:
  node_modules:
