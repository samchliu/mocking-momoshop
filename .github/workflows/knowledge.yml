name: knowledge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npx kb validate # add --strict once the backlog is clean
      - run: npx kb build
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-build
          path: docs/_build/
